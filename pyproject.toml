[project]
name = "sbc-extractor"
version = "0.1.0"
description = "Fine-tuned small language model for structured extraction from ACA SBC documents, served with vLLM"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "mlx-lm>=0.32.2",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "transformers>=5.20.1",
]
