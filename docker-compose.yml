# docker compose up --build   ->  http://localhost:8080
# Catalog (optional, once):   docker compose run --rm backend uv run --no-dev sbcx ingest-catalog
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      # Read from a .env file next to this compose file when present. (Plain variable substitution
      # instead of `env_file: required: false`, which needs Compose >= 2.24.)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SBCX_LLM_MODE: ${SBCX_LLM_MODE:-openrouter}
      SBCX_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - sbcx-var:/data/var
      - ./data:/app/data:ro   # local SBC corpus + CMS PUF, used by `sbcx ingest-catalog`
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 6
  frontend:
    build: { context: frontend }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  sbcx-var:
