name: ci
on:
  push: { branches: [main, "design/**"] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.7.19" }
      - run: uv sync --frozen
      - run: uv run ruff check sbcx tests && uv run ruff format --check sbcx tests
      - run: uv run mypy sbcx
      # PDF-based tests skip automatically: the SBC corpus (data/raw) isn't in git
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm test -- --run
      - run: npm run build
